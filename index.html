<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <!-- FontAwesome for the clean, professional icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

.phone-container {
  width: 100%;
  min-height: 100vh;
  background-color: #000000;
  box-sizing: border-box;
}
        }

        /* Top Header Section (Dark Background) */
        .profile-header {
            background-color: #000000;
            padding: 40px 20px 30px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Image with Hover Upload Trigger */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .avatar-container:hover .upload-overlay {
            opacity: 1;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffffff;
        }

        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            padding: 10px;
        }

        #file-input {
            display: none;
        }

        .profile-name {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Add Contact Button styled like the screenshot */
        .add-contact-btn {
            background-color: #6d645a;
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .add-contact-btn:hover {
            background-color: #595148;
        }

        /* Bottom Section (White Content Surface) */
        .details-container {
            background-color: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card container formatting */
        .info-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #111;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-header-left i {
            color: #666;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .chevron-icon {
            color: #aaa;
            font-size: 14px;
            transition: transform 0.3s;
        }

        .card-content {
            padding: 0 18px;
        }

        /* Alignment for rows inside cards */
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #f9f9f9;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .row-icon-container {
            background-color: #f7f7f9;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .row-icon {
            color: #666;
            font-size: 15px;
        }

        .row-data {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .row-label {
            font-size: 12px;
            color: #888;
            font-weight: 500;
        }

        .row-value {
            font-size: 15px;
            color: #111;
            word-break: break-word;
            line-height: 1.4;
        }

        a.row-value {
            color: #111;
            text-decoration: none;
        }

        a.row-value:hover {
            text-decoration: underline;
        }

        /* WhatsApp Button styling matching the image precisely */
        .whatsapp-btn {
            background-color: #8a8073;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            margin: 14px 18px;
        }

        .whatsapp-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .whatsapp-left i {
            background-color: #25D366;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Profile Area -->
        <div class="profile-header">
            <div class="avatar-container" onclick="triggerUpload()">
                <img id="profile-image" class="profile-pic" src="https://placeholder.com" alt="Profile Picture">
                <div class="upload-overlay">
                    <span><i class="fa-solid fa-camera"></i><br>Change Photo</span>
                </div>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="loadPhoto(event)">

            <h1 class="profile-name">Genesis Deang</h1>
            <button class="add-contact-btn">
                <i class="fa-solid fa-circle-plus"></i> Add contact
            </button>
        </div>

        <!-- Interactive Cards Container -->
        <div class="details-container">
            
            <!-- Contact Block Card -->
            <div class="info-card">
                <div class="card-header">
                    <div class="card-header-left">
                        <i class="fa-solid fa-phone"></i>
                        <span>Contact</span>
                    </div>
                    <i class="fa-solid fa-chevron-down chevron-icon"></i>
                </div>
                <div class="card-content">
                    <div class="info-row">
                        <div class="row-icon-container"><i class="fa-solid fa-phone row-icon"></i></div>
                        <div class="row-data">
                            <span class="row-label">Work</span>
                            <a href="tel:+971588393108" class="row-value">+971588393108</a>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="row-icon-container"><i class="fa-solid fa-envelope row-icon"></i></div>
                        <div class="row-data">
                            <span class="row-label">Work</span>
                            <a href="mailto:genesis@huzaifa1.ae" class="row-value">genesis@huzaifa1.ae</a>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="row-icon-container"><i class="fa-solid fa-link row-icon"></i></div>
                        <div class="row-data">
                            <span class="row-label">Website</span>
                            <a href="https://alhuzaifa.com" target="_blank" class="row-value">www.alhuzaifa.com</a>
                        </div>
                    </div>
                    <div class="info-row">
                        <div class="row-icon-container"><i class="fa-solid fa-location-dot row-icon"></i></div>
                        <div class="row-data">
                            <span class="row-label">Location:</span>
                            <span class="row-value">Zomorrodah Building - Block B Umm Hurair Rd - near Karama post office, Al Karama - Dubai, United Arab Emirates</span>
                        </div>
                    </div>
                </div>
            </div>
              });
    </script>
</body>
</html>
