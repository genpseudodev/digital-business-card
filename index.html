<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">

  <title>Genesis Deang - Digital Business Card</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #000;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .phone-container {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(32px, env(safe-area-inset-top))
               24px
               max(32px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    .profile-avatar {
      display: block;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-bottom: 18px;
      object-fit: cover;
      background: #222;
      box-shadow: 0 4px 15px rgba(255, 255, 255, .1);
    }

    .profile-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.5px;
      margin-bottom: 4px;
    }

    .profile-title {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .profile-company {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .add-contact-btn {
      display: block;
      width: 100%;
      padding: 15px 24px;
      margin-bottom: 24px;
      border-radius: 30px;
      background: #fff;
      color: #000;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .contact-links-list {
      width: 100%;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-item-link {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 50px;
      padding: 14px 16px;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      text-align: left;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
