<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <style>
        /* 1. DEFINE YOUR COLOR PALETTE */
        :root {
            --background-color: #f4f7f6; /* Soft off-white canvas background */
            --card-background: #ffffff;   /* Pure white card container */
            --primary-color: #2c3e50;      /* Dark navy for titles and headers */
            --accent-color: #16a085;       /* Teal color for buttons, links, and borders */
            --text-muted: #7f8c8d;         /* Slate gray for secondary text */
        }

        /* 2. GENERAL LAYOUT AND BACKGROUND */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 3. CARD CONTAINER STYLING */
        .card {
            background-color: var(--card-background);
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            overflow: hidden;
            border-top: 8px solid var(--accent-color); /* Visual horizontal anchor */
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 4. PHOTO CONTAINER STYLING */
        .photo-container {
            margin-top: 30px;
            position: relative;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Makes the photo perfectly circular */
            object-fit: cover; /* Prevents image distortion */
            border: 4px solid var(--card-background);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* 5. TEXT STYLING */
        .info-container {
            padding: 20px 30px 30px 30px;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 10px 0 5px 0;
        }

        .title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .bio {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* 6. ACTION BUTTONS & LINKS */
        .btn {
            display: block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #117a65; /* Darker variant of the accent color for hover state */
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>

    <!-- DIGITAL BUSINESS CARD CONTAINER -->
    <div class="card">
        
        <!-- PHOTO SECTION -->
        <div class="photo-container">
            <!-- Replace 'profile.jpg' with your actual image path or online image URL -->
            <img src="profile.jpg" alt="Your Name" class="profile-photo">
        </div>

        <!-- TEXT & ACTIONS SECTION -->
        <div class="info-container">
            <h1 class="name">Jane Doe</h1>
            <p class="title">Software Engineer</p>
            <p class="bio">Building clean, impactful web solutions. Open to collaborations and freelance opportunities.</p>

            <!-- CALL TO ACTION LINKS -->
            <a href="mailto:your.email@example.com" class="btn">Email Me</a>
            <a href="https://github.com" target="_blank" class="btn btn-secondary">GitHub Profile</a>
        </div>
        
    </div>

</body>
</html>
